# CI pipeline for Pathfinder Functional Backend
# Runs on every push to main and every pull request to main.
# Steps: install (npm ci for reproducibility) -> lint -> test with coverage.
# Note: Node.js 22 LTS used in CI for stability;
#       Node.js 26 is used in local development.
# Database is not required because all tests use mocked
# Sequelize models (unit testing best practice).

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-test-coverage:
    name: Lint, Test and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:ci
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-key

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
